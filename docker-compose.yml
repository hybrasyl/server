services:
  world-data:
    image: alpine:latest
    command: >
      sh -c "apk add --no-cache git openssl &&
      if [ -d /world/.git ]; then
        cd /world && git pull;
      else
        git clone https://github.com/hybrasyl/ceridwen.git /world;
      fi &&
      if ! { [ -s /world/grpc-chain.pem ] && [ -s /world/grpc-cert.pem ] && [ -s /world/grpc-key.pem ] && [ -s /world/hybctl-cert.pem ] && [ -s /world/hybctl-key.pem ]; }; then
        printf 'subjectAltName=DNS:hybrasyl-server,DNS:localhost,IP:127.0.0.1\n' > /tmp/san.cnf &&
        openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -sha256 -subj "/CN=hybrasyl-grpc-ca" -keyout /tmp/ca-key.pem -out /world/grpc-chain.pem &&
        openssl req -newkey rsa:2048 -nodes -subj "/CN=hybrasyl-docker" -keyout /world/grpc-key.pem -out /tmp/server.csr &&
        openssl x509 -req -in /tmp/server.csr -CA /world/grpc-chain.pem -CAkey /tmp/ca-key.pem -CAcreateserial -days 365 -sha256 -extfile /tmp/san.cnf -out /world/grpc-cert.pem &&
        openssl req -newkey rsa:2048 -nodes -subj "/CN=hybctl" -keyout /world/hybctl-key.pem -out /tmp/hybctl.csr &&
        openssl x509 -req -in /tmp/hybctl.csr -CA /world/grpc-chain.pem -CAkey /tmp/ca-key.pem -CAcreateserial -days 365 -sha256 -out /world/hybctl-cert.pem &&
        rm -f /tmp/ca-key.pem /tmp/server.csr /tmp/hybctl.csr /tmp/san.cnf /world/grpc-chain.srl &&
        chmod 755 /world/grpc-cert.pem /world/grpc-key.pem /world/grpc-chain.pem /world/hybctl-cert.pem /world/hybctl-key.pem
      fi"
    volumes:
      - world:/world

  valkey:
    image: valkey/valkey:latest
    volumes:
      - valkey-data:/data
    networks:
      - hybrasyl

  hybrasyl-server:
    image: ghcr.io/hybrasyl/server:latest
    container_name: hybrasyl-server
    platform: linux/amd64
    build: .  # uncomment to build from source
    ports:
      - "2610:2610" # lobby
      - "2611:2611" # login
      - "2612:2612" # world
      - "2613:2613" # grpc
    networks:
      - hybrasyl
    environment:
      - HYB_REDIS_HOST=valkey
      - HYB_DATA_DIR=/world
      - HYB_WORLD_DIR=/world/xml
      - HYB_CONFIG_FILE=/config/config.xml
    volumes:
      - world:/world:ro
      - ./contrib/config.xml:/config/config.xml:ro
    depends_on:
      world-data:
        condition: service_completed_successfully
      valkey:
        condition: service_started

volumes:
  world:
  valkey-data:

networks:
  hybrasyl:
    external: true
